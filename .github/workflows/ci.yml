name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
          - os: windows-latest
            preset: x64-windows-release
          - os: windows-11-arm
            preset: arm64-windows-release
          - os: macos-13
            preset: x64-macos-release
          - os: macos-latest
            preset: arm64-macos-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" || "$VCPKG_ROOT/bootstrap-vcpkg.bat"
        shell: bash
      - name: Configure + build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }}
        shell: bash
      - name: Run example
        run: build/${{ matrix.preset }}/examples/hello/liqology_hello 7
        shell: bash

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build asan-ubsan
        run: |
          cmake --preset asan-ubsan
          cmake --build build/asan-ubsan
      - name: Run clean path (must pass)
        run: build/asan-ubsan/examples/hello/liqology_hello 7
      - name: Run injected-bug path (must be caught by ASan)
        run: |
          set +e
          build/asan-ubsan/examples/hello/liqology_hello --inject-bug
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "expected ASan to abort on injected bug, got clean exit"
            exit 1
          fi

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: Run clang-tidy
        run: clang-tidy -p build/debug include/liqology/*.hpp

  wasip1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p /opt/wasi-sdk
          tar xf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          echo "WASI_SDK_PREFIX=/opt/wasi-sdk" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build wasip1
        run: |
          cmake --preset wasip1-release
          cmake --build build/wasip1-release
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Run under wasmtime
        run: wasmtime build/wasip1-release/examples/hello/liqology_hello.wasm 7
