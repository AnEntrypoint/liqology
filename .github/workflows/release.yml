name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: x64-linux-release
            artifact: liqology-x64-linux
          - os: ubuntu-24.04-arm
            preset: arm64-linux-release
            artifact: liqology-arm64-linux
          - os: windows-latest
            preset: x64-windows-release
            artifact: liqology-x64-windows
          - os: windows-11-arm
            preset: arm64-windows-release
            artifact: liqology-arm64-windows
          - os: macos-13
            preset: x64-macos-release
            artifact: liqology-x64-macos
          - os: macos-latest
            preset: arm64-macos-release
            artifact: liqology-arm64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" || "$VCPKG_ROOT/bootstrap-vcpkg.bat"
        shell: bash
      - name: Remove Visual Studio's bundled LLVM Flang from PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest now bundles VS 2026's own LLVM Flang (flang.exe), which CMake's
          # Fortran auto-detection finds before vcpkg's own vcpkg-gfortran package registers
          # itself mid-build -- lapack-reference then compiles against Flang instead of the
          # gfortran-15.2.0 vcpkg actually pinned, and Flang's iso_fortran_env support fails
          # to parse LAPACK's real32/tol/zero-style module usage. Strip any PATH entry that
          # contains VS's LLVM tools dir so CMake can only resolve the vcpkg-provided compiler.
          $filtered = $env:PATH -split ';' | Where-Object { $_ -notmatch 'Llvm\\x64\\bin' }
          $newPath = $filtered -join ';'
          Write-Host "Removed $((($env:PATH -split ';').Count) - $filtered.Count) VS LLVM PATH entries"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure + build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --install build/${{ matrix.preset }} --prefix out/${{ matrix.artifact }}
        shell: bash
      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz -C out ${{ matrix.artifact }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  build-wasip1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p /opt/wasi-sdk
          tar xf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          echo "WASI_SDK_PREFIX=/opt/wasi-sdk" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build
        run: |
          cmake --preset wasip1-release
          cmake --build build/wasip1-release
      - name: Package
        run: |
          mkdir -p out/liqology-wasip1
          cp build/wasip1-release/examples/hello/liqology_hello.wasm out/liqology-wasip1/
          cp -r include out/liqology-wasip1/
          tar czf liqology-wasip1.tar.gz -C out liqology-wasip1
      - uses: actions/upload-artifact@v4
        with:
          name: liqology-wasip1
          path: liqology-wasip1.tar.gz

  build-agentplug-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        run: |
          curl -fsSL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          mkdir -p /opt/wasi-sdk
          tar xf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          echo "WASI_SDK_PREFIX=/opt/wasi-sdk" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 2026.06.24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
      - name: Configure + build agentplug-liqology plugin
        run: |
          cmake --preset wasip1-threads-release
          cmake --build build/wasip1-threads-release --target agentplug_liqology
      - name: Stage release asset with checksum
        run: |
          mkdir -p release-assets
          cp build/wasip1-threads-release/agentplug-liqology/agentplug_liqology.wasm release-assets/liqology.wasm
          cd release-assets
          sha256sum liqology.wasm | sed 's/ \*/  /' > liqology.wasm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: liqology-agentplug-plugin
          path: release-assets/

  publish-release:
    needs: [build-artifact, build-wasip1, build-agentplug-plugin]
    if: always() && needs.build-wasip1.result == 'success' && needs.build-agentplug-plugin.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          find dist -name '*.tar.gz' -exec mv {} dist/ \;
          find dist -name 'liqology.wasm*' -exec mv {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
